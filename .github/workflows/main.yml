name: Build WF
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/cohort2-chetan-gaikwad

jobs:
  Build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      # Todo: Can we skip this step?
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Lint check
        run: |
          ruff check .

      - name: Run tests
        run: |
          pytest

  Build-and-push:
    runs-on: ubuntu-latest
    needs: Build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            

  Deploy:
    runs-on: self-hosted
    needs: Build-and-push
    concurrency: deploy-cohort2
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Apply namespace and config
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml

      - name: Roll out new image
        run: |
          kubectl set image deployment/cohort2-api \
            api=${{ env.IMAGE_NAME }}:${{ github.sha }} -n cohort2

      - name: Wait for rollout
        run: kubectl rollout status deployment/cohort2-api -n cohort2 --timeout=120s

      - name: Verify /health
        run: |
          kubectl port-forward -n cohort2 svc/cohort2-api 18080:80 &
          echo $! > pf.pid
          sleep 3
          curl --fail http://localhost:18080/health

      - name: Stop port-forward
        if: always()
        run: kill $(cat pf.pid) || true

      - name: Show cluster state on failure
        if: failure()
        run: |
          kubectl get pods -n cohort2
          kubectl describe deployment/cohort2-api -n cohort2
          kubectl logs deploy/cohort2-api -n cohort2 --tail=50      
            
