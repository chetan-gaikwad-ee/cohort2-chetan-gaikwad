name: Build WF
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/cohort2-chetan-gaikwad

jobs:
  Build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      # Todo: Can we skip this step?
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Lint check
        run: |
          ruff check .

      - name: Run tests
        run: |
          pytest

  Build-and-push:
    runs-on: ubuntu-latest
    needs: Build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
              

  Helm-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint chart (defaults, dev, prod)
        run: |
          helm lint helm/health-api --strict
          helm lint helm/health-api --strict -f helm/health-api/values-dev.yaml
          helm lint helm/health-api --strict -f helm/health-api/values-prod.yaml

      - name: Render templates (dev and prod)
        run: |
          helm template health-api helm/health-api -n cohort2-dev  -f helm/health-api/values-dev.yaml
          helm template health-api helm/health-api -n cohort2-prod -f helm/health-api/values-prod.yaml          
            
  Deploy:
    runs-on: self-hosted
    needs: [Build-and-push, Helm-validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency: deploy-cohort2
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Helm upgrade (dev)
        run: |
          helm upgrade --install health-api helm/health-api \
            -n cohort2-dev \
            -f helm/health-api/values-dev.yaml \
            --set image.tag=${{ github.sha }} \
            --rollback-on-failure --wait --timeout 180s

      - name: Show release
        run: |
          helm status health-api -n cohort2-dev
          helm history health-api -n cohort2-dev

      - name: Verify /health
        run: |
          kubectl port-forward -n cohort2-dev svc/health-api 18080:80 &
          echo $! > pf.pid
          sleep 3
          curl --fail http://localhost:18080/health

      - name: Stop port-forward
        if: always()
        run: kill $(cat pf.pid) || true

      - name: Show cluster state on failure
        if: failure()
        run: |
          kubectl get pods -n cohort2-dev
          kubectl describe deployment/health-api -n cohort2-dev
          kubectl logs deploy/health-api -n cohort2-dev --tail=50