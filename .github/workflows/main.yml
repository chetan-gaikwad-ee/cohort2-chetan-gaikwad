name: Build WF
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/cohort2-chetan-gaikwad

jobs:
  Build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      # Todo: Can we skip this step?
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Lint check
        run: |
          ruff check .

      - name: Run tests
        run: |
          pytest

  Build-and-push:
    runs-on: ubuntu-latest
    needs: Build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            

  Deploy:
    runs-on: ubuntu-latest
    needs: Build-and-push
    steps:

      - name: Pull image
        run: docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Run container
        run: |
          docker run -d --name app -p 8000:8000 \
            -e ENVIRONMENT=ci \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Verify /health
        run: |
          sleep 5
          curl --fail http://127.0.0.1:8000/health

      - name: Logs and cleanup
        if: always()
        run: |
          docker logs app || true
          docker rm -f app || true          
            
