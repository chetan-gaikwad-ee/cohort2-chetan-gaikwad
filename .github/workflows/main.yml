name: Build WF
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  Build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      # Todo: Can we skip this step?
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest    

  Deploy:
    runs-on: ubuntu-latest
    needs: Build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      # Todo: Can we skip this step?
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Start FastAPI server
        run: |
          uvicorn main:app &
          sleep 5
          curl --fail http://127.0.0.1:8000/health
          kill $!


