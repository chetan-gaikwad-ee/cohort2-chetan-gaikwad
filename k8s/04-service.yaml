apiVersion: v1
kind: Service
metadata:
  name: fastapi-svc
  namespace: cohort2-nonprod
  labels:
    app: fastapi-app
spec:
  type: NodePort
  selector:
    app: fastapi-app     # selects by LABEL, never by pod name
  ports:
    - name: http
      port: 80           # the Service's own port -> http://fastapi-svc/health in-cluster
      targetPort: http   # the container's named port, i.e. 8000
      nodePort: 30080    # open on every node; k3d maps your Mac's 8080 to it